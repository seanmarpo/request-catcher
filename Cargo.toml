[package]
name = "request_catcher"
version = "0.6.1"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = 'abort'
opt-level = 3

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
